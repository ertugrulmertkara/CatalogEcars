<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sessiz Seçim — Elektrikli Araç Rehberi</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="landing">
    <!-- Arka plandaki şarj kablolarının üstünde akan enerji efekti.
         viewBox görselin gerçek boyutu (1376x768), "slice" = CSS'teki background-size: cover;
         böylece çizgiler her ekran boyutunda görseldeki kabloların tam üstüne oturur. -->
    <svg class="cable-flow" viewBox="0 0 1376 768" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <!-- Her kabloda iki katman: sönerek biten uzun sarı kuyruk + önde parlak baş -->
      <path class="cable-tail" pathLength="100" d="M1034 414 C1058 418 1077 438 1077 460 L1079.5 556 C1079.5 571.5 1092 584 1107.5 584 L1376 584" />
      <path class="cable-head" pathLength="100" d="M1034 414 C1058 418 1077 438 1077 460 L1079.5 556 C1079.5 571.5 1092 584 1107.5 584 L1376 584" />
      <path class="cable-tail cable-late" pathLength="100" d="M1050 423 C1060 428 1066 440 1066 452 L1070 560 C1070 580 1086 595.5 1106 595.5 L1376 595.5" />
      <path class="cable-head cable-late" pathLength="100" d="M1050 423 C1060 428 1066 440 1066 452 L1070 560 C1070 580 1086 595.5 1106 595.5 L1376 595.5" />
    </svg>
    <div class="landing-content">
      
      <h1 class="landing-title">Sessiz Seçim</h1>
      <p class="landing-subtitle">
        Türkiye'de satılan elektrikli araçları menzil, fiyat ve kasa tipine göre
        karşılaştırın. Beğendiklerinizi kısa listeye alın, elediklerinizi işaretleyin.
      </p>
      <div class="login-container">
  <div class="glass-panel">

    <div class="logo-box">
       <!-- Logo: orijinal logodaki araba ikonu + aynı stilde kalın yazı -->
       <div class="brand-logo" role="img" aria-label="Sessiz Seçim">
         <img src="assets/logo-car.png" alt="" class="brand-logo-car">
         <span class="brand-logo-text">Sessiz Seçim</span>
       </div>
    </div>
    <!-- LOGIN FORM -->
    <form id="loginForm">
      <div class="input-group">
        <span class="icon">👤</span>
        <input type="text" id="username" placeholder="Kullanıcı Adı" required>
      </div>
      <div class="input-group">
        <span class="icon">🔒</span>
        <input type="password" id="password" placeholder="Şifre" required>
        <span class="icon eye-icon" data-target="password">👁️</span>
      </div>
      <div class="options">
        <label><input type="checkbox"> Beni Hatırla</label>
        <a href="#">Şifremi Unuttum?</a>
      </div>
      <!-- Hata Mesajı Alanı -->
      <p id="login-error" style="color: #ff4d4d; font-size: 13px; text-align: center; display: none; margin-top: 0; margin-bottom: 15px;"></p>
      
      <button type="submit" class="btn-login">Giriş Yap</button>
      
      <div style="text-align: center; margin-top: 20px; font-size: 13px; font-weight: 300;">
        Hesabın yok mu? <a href="#" id="showRegister" style="color: rgba(255, 200, 0, 0.8); text-decoration: none; font-weight: 600;">Kayıt Ol</a>
      </div>
    </form>

    <!-- REGISTER FORM (Başlangıçta Gizli) -->
    <form id="registerForm" style="display: none;">
      <div class="input-group">
        <span class="icon">👤</span>
        <input type="text" id="reg-username" placeholder="Yeni Kullanıcı Adı" required>
      </div>
      <div class="input-group">
        <span class="icon">🔒</span>
        <input type="password" id="reg-password" placeholder="Şifre Belirle" required>
        <span class="icon eye-icon" data-target="reg-password">👁️</span>
      </div>
      <div class="input-group">
        <span class="icon">🔒</span>
        <input type="password" id="reg-password-confirm" placeholder="Şifreyi Doğrula" required>
      </div>
      
      <!-- Hesap Türü (Rol) Seçimi -->
      <div class="input-group">
        <span class="icon">🏢</span>
        <select id="reg-role" required style="width: 100%; padding: 12px 15px 12px 40px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255, 200, 0, 0.25); border-radius: 25px; color: #fff; font-size: 14px; outline: none; appearance: none; -webkit-appearance: none; cursor: pointer;">
          <option value="user" style="color: black;">Bireysel Kullanıcı</option>
          <option value="dealer" style="color: black;">Bayi (Kurumsal)</option>
        </select>
      </div>
      
      <!-- Hata/Başarı Mesajı Alanı -->
      <p id="register-msg" style="font-size: 13px; text-align: center; display: none; margin-top: 0; margin-bottom: 15px;"></p>
      
      <button type="submit" class="btn-login">Kayıt Ol</button>
      
      <div style="text-align: center; margin-top: 20px; font-size: 13px; font-weight: 300;">
        Zaten hesabın var mı? <a href="#" id="showLogin" style="color: rgba(255, 200, 0, 0.8); text-decoration: none; font-weight: 600;">Giriş Yap</a>
      </div>
    </form>
  </div>
</div>

      <!-- Butonu panelin tam ortasında tutmak için panel genişliğinde (320px) bir sarıcı ekledik -->
      <div style="width: 100%; max-width: 320px; text-align: center;">
        <a href="app.html" class="btn btn-primary" id="rehbereGit">Misafir Olarak İncele</a>
      </div>
    </div>
  </main>
  
  <script src="js/login.js"></script>
</body>
</html>
